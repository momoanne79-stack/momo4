<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>수리나무학원 문법 Unit23-24 언스크램블</title>
<style>
:root {
  --main:#1a5c9a; --main2:#0d3458; --accent:#f5a623; --bg:#f3f8ff; --soft:#eef7ff;
  --text:#102033; --muted:#60758a; --green:#22a06b; --red:#e5534b; --line:#d3e6f7;
  --shadow:0 12px 32px rgba(26,92,154,.18);
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body {
  margin:0; padding:14px; background:var(--bg); color:var(--text);
  font-family:'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;
  overscroll-behavior-y:contain;
}
#app { max-width:560px; margin:0 auto; background:#fff; border-radius:22px; overflow:hidden; box-shadow:var(--shadow); min-height:96vh; }
.header { background:linear-gradient(135deg,var(--main),var(--main2)); color:white; text-align:center; padding:22px 16px 16px; }
.header .label { display:inline-block; background:var(--accent); color:#432700; padding:5px 12px; border-radius:999px; font-size:12px; font-weight:900; margin-bottom:8px; }
.header h1 { margin:4px 0; font-size:21px; line-height:1.25; }
.header p { margin:0; opacity:.92; font-size:13px; font-weight:800; }
.nav {
  display:grid; grid-template-columns:repeat(4,1fr); gap:6px; padding:10px; background:#f7fbff;
  position:sticky; top:0; z-index:20; border-bottom:1px solid #e3eef7;
}
.nav button {
  width:100%; min-height:48px; border:0; border-radius:12px; background:#e8f1fa; color:#24445f;
  font-weight:900; font-size:13px; cursor:pointer; padding:5px 3px;
}
.nav button.active { background:var(--main); color:white; box-shadow:0 4px 12px rgba(26,92,154,.25); }
.section { display:none; padding:16px; }
.section.active { display:block; animation:fade .22s ease; }
@keyframes fade { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
.card { border:1.5px solid var(--line); border-radius:18px; padding:15px; margin-bottom:13px; background:#fff; }
.soft { background:var(--soft); border-color:#c4ddf4; }
.title { color:var(--main); font-size:18px; font-weight:1000; margin:0 0 8px; }
.sub { color:var(--muted); font-size:13px; font-weight:800; line-height:1.55; }
.status { display:flex; justify-content:space-between; gap:8px; align-items:center; margin-bottom:10px; flex-wrap:wrap; }
.badge { display:inline-block; background:#e8f1fa; color:#24445f; border-radius:999px; padding:7px 10px; font-size:13px; font-weight:900; }
.progress { height:12px; background:#dbeefa; border-radius:999px; overflow:hidden; margin:9px 0 0; }
.bar { height:100%; width:0%; background:linear-gradient(90deg,var(--accent),var(--main)); transition:.35s; }
.koBox {
  background:#eef7ff; border-left:6px solid var(--main); border-radius:16px; padding:15px 14px;
  font-weight:1000; line-height:1.6; color:#0e3758; margin-bottom:12px; font-size:18px;
}
.metaLine { color:var(--muted); font-size:14px; font-weight:900; margin-bottom:7px; }
.answerArea, .wordBank {
  display:flex; flex-wrap:wrap; gap:10px; justify-content:center; align-items:center;
  min-height:78px; border-radius:16px; padding:13px; margin-bottom:12px; transition:.2s;
}
.answerArea { border:2.5px dashed var(--main); background:#eef7ff; }
.wordBank { border:2px solid #e6eef6; background:#f8fbff; }
.answerArea.ok { background:#e8fff4; border-color:var(--green); }
.answerArea.bad { background:#fff0f0; border-color:var(--red); animation:shake .3s; }
@keyframes shake { 0%{transform:translateX(0)} 30%{transform:translateX(-5px)} 60%{transform:translateX(5px)} 100%{transform:translateX(0)} }
.chip {
  border:2px solid #b8d6ef; background:white; border-radius:12px; padding:11px 14px;
  font-weight:1000; font-size:16px; cursor:grab; touch-action:none; user-select:none; color:#18344d;
  box-shadow:0 2px 5px rgba(26,92,154,.08); line-height:1.15;
}
.chip:active { transform:scale(.98); }
.dragging {
  position:fixed; z-index:9999; pointer-events:none; opacity:.96; background:var(--main)!important; color:#fff!important;
  transform:translate(-50%,-50%) scale(1.04); box-shadow:0 12px 28px rgba(0,0,0,.22);
}
.drag-placeholder {
  display:inline-block; min-width:62px; min-height:42px; border:2px dashed var(--accent); border-radius:12px; background:#fff7de;
}
.tip { background:#fff8e8; border:1.5px solid #f5d28b; color:#805300; border-radius:13px; padding:10px; line-height:1.45; font-size:13px; font-weight:900; margin:8px 0 12px; }
.feedback {
  display:none; text-align:center; font-weight:1000; border-radius:16px; padding:13px; margin:12px 0; font-size:18px;
}
.feedback.show { display:block; }
.feedback.good { background:#e8fff4; color:#11623d; border:2px solid var(--green); }
.feedback.bad { background:#fff0f0; color:#b63530; border:2px solid var(--red); }
.okFlash {
  position:fixed; left:50%; top:36%; transform:translate(-50%,-50%) scale(.6);
  z-index:99999; font-size:42px; font-weight:1000; color:#fff; background:rgba(34,160,107,.94);
  border:4px solid #fff; box-shadow:0 12px 38px rgba(34,160,107,.36); border-radius:999px;
  padding:18px 28px; opacity:0; pointer-events:none;
}
.okFlash.pop { animation:okPop .78s ease-out forwards; }
@keyframes okPop {
  0%{opacity:0; transform:translate(-50%,-40%) scale(.55)}
  20%{opacity:1; transform:translate(-50%,-50%) scale(1.08)}
  70%{opacity:1; transform:translate(-50%,-50%) scale(1)}
  100%{opacity:0; transform:translate(-50%,-58%) scale(.86)}
}
button.primary {
  width:100%; border:0; border-radius:14px; min-height:52px; padding:13px 12px;
  font-weight:1000; font-size:16px; cursor:pointer; background:var(--main); color:#fff; margin-top:8px;
}
button.secondary {
  width:100%; border:0; border-radius:14px; min-height:48px; padding:12px; font-weight:1000;
  background:#e8f1fa; color:#24445f; margin-top:8px; cursor:pointer;
}
button.danger { background:var(--red); color:#fff; }
button.pass { background:var(--green); color:#fff; }
.answerFull { font-family:Georgia,'Times New Roman',serif; font-size:17px; line-height:1.6; margin-top:7px; color:#143c5c; }
.hist-row { display:flex; justify-content:space-between; align-items:center; gap:10px; background:#f8fbff; border:1.5px solid #e4eef8; border-radius:15px; padding:13px; margin-bottom:10px; }
.hist-row b { color:var(--main); font-size:15px; }
.hist-score { font-size:22px; font-weight:1000; color:var(--green); white-space:nowrap; }
.wrong-item { border-left:6px solid var(--red); background:#fff7f7; border-radius:15px; padding:13px; margin-bottom:10px; }
.wrong-item b { color:#b63530; }
.wrong-en { font-family:Georgia,'Times New Roman',serif; margin-top:6px; font-weight:900; color:#173653; }
.empty { text-align:center; padding:24px 10px; color:var(--muted); font-weight:900; }
.unit-complete { text-align:center; padding:10px 0; }
.bigIcon { font-size:48px; margin-bottom:8px; }
@media (max-width:410px) {

  .nav button { font-size:12px; min-height:44px; }
  .koBox { font-size:17px; }
  .chip { font-size:15px; padding:10px 12px; }

const STORE = 'surinamu_grammar_1246_units23_24_v1';
const UNIT_KEYS = Object.keys(DATA);
let currentUnit = 'unit23';
let wrongMode = false;
let wrongList = [];
let wrongIdx = 0;
let activeItem = null;
let answered = false;
let audioCtx = null;

function cleanToken(t) {
  return t.replace(/[“”‘’".,!?]/g,'').replace(/’/g,"'").trim();
}
function tokenList(s) {
  return s.split(/\s+/).map(cleanToken).filter(Boolean);
}
function norm(s) {
  return s.toLowerCase()
    .replace(/[“”‘’'".,!?]/g,'')
    .replace(/[^a-z0-9]+/g,' ')
    .trim();
}
function shuffle(arr) {
  const a=[...arr];
  for(let i=a.length-1;i>0;i--) {
    const j=Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
function nowStr() {
  return new Date().toLocaleString('ko-KR', {month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'});
}
function getJSON(k, def) {
  try { const v = JSON.parse(localStorage.getItem(STORE+k)); return v ?? def; }
  catch(e) { return def; }
}
function setJSON(k, v) { localStorage.setItem(STORE+k, JSON.stringify(v)); }

function initUnitState(unit) {
  const total = DATA[unit].items.length;
  let s = getJSON('_state_'+unit, null);
  if(!s) s = {current:0, completed:[], wrong:[], wrongCleared:[], firstTryCorrect:[], attempts:0, bestScore:0, lastTime:'', passed:false};
  if(!Array.isArray(s.completed)) s.completed=[];
  if(!Array.isArray(s.wrong)) s.wrong=[];
  if(!Array.isArray(s.wrongCleared)) s.wrongCleared=[];
  if(!Array.isArray(s.firstTryCorrect)) s.firstTryCorrect=[];
  s.current = Math.min(s.current||0, total);
  return s;
}
function saveUnitState(unit, s) { s.lastTime = nowStr(); setJSON('_state_'+unit, s); }

function setTabs(active) {
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  const btn = document.getElementById('tab-'+active);
  if(btn) btn.classList.add('active');
  document.querySelectorAll('.section').forEach(s=>s.classList.remove('active'));
}

function showUnit(unit, index=null) {
  wrongMode=false;
  currentUnit=unit;
  setTabs(unit);
  document.getElementById('learnSec').classList.add('active');
  const s = initUnitState(unit);
  if(index!==null && Number.isInteger(index)) {
    s.current = Math.max(0, Math.min(index, DATA[unit].items.length));
    saveUnitState(unit, s);
  }
  renderUnit();
}

function renderUnit() {
  const unit = DATA[currentUnit];
  const s = initUnitState(currentUnit);
  const total = unit.items.length;
  if(s.current >= total) {
    renderComplete(currentUnit);
    return;
  }
  const item = unit.items[s.current];
  activeItem = item;
  answered = false;
  const score = calcScore(currentUnit);
  const pct = Math.round((s.completed.length/total)*100);
  document.getElementById('unitBox').innerHTML = `
    <div class="status">
      <span class="badge">${unit.label} · ${unit.title}</span>
      <span class="badge">문제 ${s.current+1} / ${total}</span>
      <span class="badge">점수 ${score}점</span>
    </div>
    <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
    <div class="card soft" style="margin-top:12px">
      <div class="metaLine">${item.no} · 아래 한글 뜻에 맞게 영어 단어 순서를 맞추세요.</div>
      <div class="koBox">${item.ko}</div>
      <div class="tip">단어를 드래그해서 순서를 바꾸세요. 터치하면 위/아래로 이동합니다. 맞으면 OK가 뜨고 다음 문제 버튼이 나타납니다.</div>
      <div id="answerArea" class="answerArea"></div>
      <div id="wordBank" class="wordBank"></div>
      <div id="feedback" class="feedback"></div>
      <button id="nextBtn" class="primary" style="display:none" onclick="nextProblem()">다음 문제 ▶</button>
    </div>
  `;
  buildChips(item.en);
}

function renderComplete(unitKey) {
  const unit = DATA[unitKey];
  const s = initUnitState(unitKey);
  const total = unit.items.length;
  const score = calcScore(unitKey);
  const wrongCount = activeWrongIds(unitKey).length;
  s.bestScore = Math.max(s.bestScore||0, score);
  s.passed = wrongCount===0 && s.completed.length>=total;
  saveUnitState(unitKey, s);
  document.getElementById('unitBox').innerHTML = `
    <div class="card soft unit-complete">
      <div class="bigIcon">${s.passed ? '🏆' : '📝'}</div>
      <div class="title">${unit.label} 완료</div>
      <div class="sub">점수 ${score}점 · 완료 ${s.completed.length}/${total} · 오답 ${wrongCount}개</div>
      <div class="progress"><div class="bar" style="width:100%"></div></div>
      ${s.passed ? '<button class="primary pass" onclick="showHistory()">100점 통과 기록 보기</button>' : '<button class="primary" onclick="showWrong()">오답 다시 풀기</button>'}
      <button class="secondary" onclick="restartUnit('${unitKey}')">이 유닛 처음부터 다시 풀기</button>
    </div>
  `;
}

function buildChips(sentence) {
  const answer = document.getElementById('answerArea');
  const bank = document.getElementById('wordBank');
  answer.innerHTML = '';
  bank.innerHTML = '';
  answer.classList.remove('ok','bad');
  const words = shuffle(tokenList(sentence));
  words.forEach(w => {
    const c = document.createElement('span');
    c.className='chip';
    c.textContent=w;
    c.dataset.word=w;
    attachChipEvents(c);
    bank.appendChild(c);
  });
}

function makePlaceholder() {
  const ph = document.createElement('span');
  ph.className = 'drag-placeholder';
  return ph;
}
let drag = null;

function attachChipEvents(chip) {
  chip.addEventListener('pointerdown', (e) => {
    if(answered) return;
    e.preventDefault();
    chip.setPointerCapture?.(e.pointerId);
    drag = {
      chip, startX:e.clientX, startY:e.clientY, x:e.clientX, y:e.clientY,
      started:false, clone:null, placeholder:null, pointerId:e.pointerId
    };
  });
  chip.addEventListener('pointermove', (e) => {
    if(!drag || drag.chip !== chip || answered) return;
    const dx = e.clientX - drag.startX;
    const dy = e.clientY - drag.startY;
    if(!drag.started && Math.hypot(dx,dy) > 6) startDragging(e);
    if(drag.started) moveDragging(e);
  });
  chip.addEventListener('pointerup', (e) => endDrag(e));
  chip.addEventListener('pointercancel', (e) => cancelDrag(e));
}

function startDragging(e) {
  drag.started = true;
  drag.placeholder = makePlaceholder();
  drag.chip.parentElement.insertBefore(drag.placeholder, drag.chip);
  drag.chip.style.visibility = 'hidden';
  drag.clone = drag.chip.cloneNode(true);
  drag.clone.classList.add('dragging');
  drag.clone.style.left = e.clientX + 'px';
  drag.clone.style.top = e.clientY + 'px';
  document.body.appendChild(drag.clone);
}

function moveDragging(e) {
  drag.x = e.clientX; drag.y = e.clientY;
  drag.clone.style.left = e.clientX + 'px';
  drag.clone.style.top = e.clientY + 'px';
  const target = containerFromPoint(e.clientX, e.clientY);
  if(target) {
    const before = getInsertBefore(target, e.clientX, e.clientY);
    target.insertBefore(drag.placeholder, before);
  }
}

function containerFromPoint(x,y) {
  const a = document.getElementById('answerArea');
  const b = document.getElementById('wordBank');
  for(const el of [a,b]) {
    if(!el) continue;
    const r = el.getBoundingClientRect();
    if(x >= r.left-12 && x <= r.right+12 && y >= r.top-12 && y <= r.bottom+12) return el;
  }
  return null;
}

function getInsertBefore(container,x,y) {
  const children = [...container.querySelectorAll('.chip')].filter(ch => ch !== drag.chip && ch.style.visibility !== 'hidden');
  let best = null, bestScore = Infinity;
  for(const child of children) {
    const r = child.getBoundingClientRect();
    const cx = r.left + r.width/2;
    const cy = r.top + r.height/2;
    const dist = Math.hypot(x-cx, y-cy);
    if(dist < bestScore) { bestScore=dist; best=child; }
  }
  if(!best) return null;
  const r = best.getBoundingClientRect();
  if(y < r.top + r.height/2 || (y < r.bottom && x < r.left + r.width/2)) return best;
  return best.nextSibling;
}

function endDrag(e) {
  if(!drag || answered) { drag=null; return; }
  const d = drag;
  if(!d.started) {
    moveChip(d.chip);
  } else {
    d.placeholder.parentElement.replaceChild(d.chip, d.placeholder);
    d.chip.style.visibility = '';
    d.clone?.remove();
    setTimeout(checkIfReady, 30);
  }
  drag=null;
}

function cancelDrag(e) {
  if(!drag) return;
  if(drag.started) {
    drag.placeholder?.parentElement?.replaceChild(drag.chip, drag.placeholder);
    drag.chip.style.visibility = '';
    drag.clone?.remove();
  }
  drag=null;
}

function moveChip(chip) {
  if(answered) return;
  const answer = document.getElementById('answerArea');
  const bank = document.getElementById('wordBank');
  if(chip.parentElement === bank) answer.appendChild(chip);
  else bank.appendChild(chip);
  checkIfReady();
}

function checkIfReady() {
  if(answered) return;
  const bank = document.getElementById('wordBank');
  if(bank && bank.children.length === 0) checkAnswer();
}

function currentAnswerText() {
  return [...document.getElementById('answerArea').querySelectorAll('.chip')].map(x=>x.textContent).join(' ');
}

function checkAnswer() {
  const ans = currentAnswerText();
  const expected = activeItem.en;
  const answerArea = document.getElementById('answerArea');
  const fb = document.getElementById('feedback');
  if(norm(ans) === norm(expected)) {
    answered = true;
    answerArea.classList.add('ok');
    showOK();
    okSound();
    if(wrongMode) markWrongSolved(activeItem.id);
    else markCorrect(activeItem.id);
    fb.className = 'feedback good show';
    fb.innerHTML = `맞았어요!<div class="answerFull">${expected}</div>`;
    document.getElementById('nextBtn').style.display = 'block';
    document.getElementById('nextBtn').scrollIntoView({behavior:'smooth', block:'nearest'});
  } else {
    answerArea.classList.add('bad');
    setTimeout(()=>answerArea.classList.remove('bad'), 450);
    markWrong(activeItem.id);
    fb.className = 'feedback bad show';
    fb.textContent = '아직 순서가 맞지 않아요. 단어를 다시 움직여 보세요.';
  }
}

function showOK() {
  const ok = document.getElementById('okFlash');
  ok.classList.remove('pop');
  void ok.offsetWidth;
  ok.classList.add('pop');
}

function okSound() {
  try {
    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if(audioCtx.state === 'suspended') audioCtx.resume();
    const play = (f, delay, dur) => {
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type='sine';
      o.frequency.setValueAtTime(f, audioCtx.currentTime + delay);
      g.gain.setValueAtTime(.09, audioCtx.currentTime + delay);
      g.gain.exponentialRampToValueAtTime(.001, audioCtx.currentTime + delay + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(audioCtx.currentTime + delay);
      o.stop(audioCtx.currentTime + delay + dur);
    };
    play(660,0,.11); play(880,.12,.16);
  } catch(e) {}
}

function itemById(id) {
  for(const u of UNIT_KEYS) {
    const item = DATA[u].items.find(x=>x.id===id);
    if(item) return {unit:u, item};
  }
  return null;
}

function markWrong(id) {
  const found = itemById(id);
  if(!found) return;
  const s = initUnitState(found.unit);
  if(!s.wrong.includes(id)) s.wrong.push(id);
  saveUnitState(found.unit, s);
}

function markCorrect(id) {
  const s = initUnitState(currentUnit);
  s.attempts = (s.attempts||0) + 1;
  if(!s.completed.includes(id)) s.completed.push(id);
  if(!s.wrong.includes(id) && !s.firstTryCorrect.includes(id)) s.firstTryCorrect.push(id);
  const idx = DATA[currentUnit].items.findIndex(x=>x.id===id);
  if(idx >= 0 && s.current <= idx) s.current = idx + 1;
  s.bestScore = Math.max(s.bestScore||0, calcScoreFromState(currentUnit, s));
  saveUnitState(currentUnit, s);
}

function markWrongSolved(id) {
  const found = itemById(id);
  if(!found) return;
  const s = initUnitState(found.unit);
  s.wrong = s.wrong.filter(x=>x!==id);
  if(!s.wrongCleared.includes(id)) s.wrongCleared.push(id);
  s.bestScore = Math.max(s.bestScore||0, calcScoreFromState(found.unit, s));
  saveUnitState(found.unit, s);
}

function activeWrongIds(unit) {
  const s = initUnitState(unit);
  return s.wrong.filter(id => !!itemById(id));
}

function calcScoreFromState(unit, s) {
  const total = DATA[unit].items.length;
  const wrongCount = s.wrong.filter(id=>!!itemById(id)).length;
  const correctNow = Math.max(0, (s.completed||[]).length - wrongCount);
  return Math.round(correctNow / total * 100);
}
function calcScore(unit) {
  return calcScoreFromState(unit, initUnitState(unit));
}

function nextProblem() {
  if(wrongMode) {
    wrongIdx++;
    if(wrongIdx < wrongList.length) renderWrongProblem();
    else showWrong();
    return;
  }
  renderUnit();
}

function restartUnit(unit) {
  if(!confirm('이 유닛 기록을 처음부터 다시 시작할까요? 오답 기록도 초기화됩니다.')) return;
  localStorage.removeItem(STORE+'_state_'+unit);
  showUnit(unit, 0);
}

function showHistory() {
  wrongMode=false;
  setTabs('history');
  document.getElementById('historySec').classList.add('active');
  renderHistory();
}

function renderHistory() {
  const box = document.getElementById('historyBox');
  let html = '';
  UNIT_KEYS.forEach(unit => {
    const u = DATA[unit];
    const s = initUnitState(unit);
    const total = u.items.length;
    const score = calcScore(unit);
    const wrongCount = activeWrongIds(unit).length;
    const pct = Math.round((s.completed.length/total)*100);
    const where = s.current >= total ? '완료' : (s.current+1)+'번부터';
    html += `
      <div class="hist-row">
        <div style="flex:1">
          <b>${u.label} · ${u.title}</b><br>
          <span class="sub">진행 ${s.completed.length}/${total} · 현재 위치 ${where} · 오답 ${wrongCount}개<br>최근 저장: ${s.lastTime || '기록 없음'}</span>
          <div class="progress"><div class="bar" style="width:${pct}%"></div></div>
        </div>
        <div class="hist-score">${score}점</div>
      </div>
      <button class="primary" onclick="showUnit('${unit}')">${u.label} 이어 풀기</button>
    `;
  });
  html += `<button class="secondary danger" onclick="clearAllRecords()">전체 기록 초기화</button>`;
  box.innerHTML = html;
}

function clearAllRecords() {
  if(!confirm('전체 기록과 오답을 모두 지울까요?')) return;
  UNIT_KEYS.forEach(unit => localStorage.removeItem(STORE+'_state_'+unit));
  renderHistory();
}

function collectWrongItems() {
  const items = [];
  UNIT_KEYS.forEach(unit => {
    const ids = activeWrongIds(unit);
    ids.forEach(id => {
      const found = itemById(id);
      if(found) items.push({unit, item:found.item});
    });
  });
  return items;
}

function showWrong() {
  setTabs('wrong');
  document.getElementById('wrongSec').classList.add('active');
  wrongMode=false;
  renderWrongList();
}

function renderWrongList() {
  const box = document.getElementById('wrongBox');
  const items = collectWrongItems();
  if(items.length === 0) {
    box.innerHTML = `<div class="card soft empty">남아 있는 오답이 없습니다.<br>100점 통과 상태입니다. 🎉</div>`;
    return;
  }
  let html = `<button class="primary" onclick="startWrongPractice()">오답 ${items.length}개 다시 풀기</button>`;
  items.forEach(({unit,item}) => {
    html += `
      <div class="wrong-item">
        <b>${DATA[unit].label} · ${item.no}</b>
        <div class="sub">${item.ko}</div>
        <div class="wrong-en">${item.en}</div>
      </div>
    `;
  });
  box.innerHTML = html;
}

function startWrongPractice() {
  wrongMode=true;
  wrongList = collectWrongItems();
  wrongIdx = 0;
  setTabs('wrong');
  document.getElementById('learnSec').classList.add('active');
  document.getElementById('historySec').classList.remove('active');
  document.getElementById('wrongSec').classList.remove('active');
  renderWrongProblem();
}

function renderWrongProblem() {
  if(wrongIdx >= wrongList.length) {
    showWrong();
    return;
  }
  const pack = wrongList[wrongIdx];
  activeItem = pack.item;
  answered = false;
  const unit = DATA[pack.unit];
  document.getElementById('unitBox').innerHTML = `
    <div class="status">
      <span class="badge">오답 다시 풀기</span>
      <span class="badge">${wrongIdx+1} / ${wrongList.length}</span>
      <span class="badge">${unit.label} · ${activeItem.no}</span>
    </div>
    <div class="card soft">
      <div class="metaLine">오답을 다시 맞히면 목록에서 제거됩니다.</div>
      <div class="koBox">${activeItem.ko}</div>
      <div class="tip">단어를 모두 올린 뒤 순서가 맞으면 OK가 뜹니다.</div>
      <div id="answerArea" class="answerArea"></div>
      <div id="wordBank" class="wordBank"></div>
      <div id="feedback" class="feedback"></div>
      <button id="nextBtn" class="primary" style="display:none" onclick="nextProblem()">다음 오답 ▶</button>
    </div>
  `;
  buildChips(activeItem.en);
}

showUnit('unit23');
</script>
</body>
</html>
